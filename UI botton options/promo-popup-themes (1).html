<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Popup – 35 Themes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f9; color: #1f2937; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 6%; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 24px; font-weight: 800; color: #0076d7; }
  .logo span { color: #ff6b00; }
  .nav-right { display: flex; gap: 10px; align-items: center; }
  select { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: #fff; cursor: pointer; }
  .reopen-btn { padding: 9px 18px; background: #0076d7; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }

  .page-content { max-width: 1000px; margin: 60px auto; padding: 0 20px; text-align: center; }
  .page-content h1 { font-size: 30px; color: #111827; margin-bottom: 10px; }
  .page-content p { color: #6b7280; font-size: 16px; }

  /* ---------- Overlay ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; animation: fadeIn .25s ease-out; }
  .modal-overlay.hidden { display: none; }

  /* ---------- Card ---------- */
  .promo-card {
    position: relative; width: 100%; max-width: 630px; min-height: 270px; border-radius: 16px;
    background: var(--bg); padding: 34px 32px; color: #fff;
    box-shadow: 0 24px 50px rgba(15,23,42,.45); display: flex; align-items: center;
    animation: popUp .35s cubic-bezier(.16,1,.3,1); transition: background .4s ease; overflow: hidden;
  }
  .close-btn { position: absolute; top: -13px; right: -13px; width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #111827; border: none; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25); z-index: 10; transition: transform .15s ease; }
  .close-btn:hover { transform: scale(1.08); }

  .promo-text { max-width: 330px; z-index: 2; position: relative; }

  .promo-headline { font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 14px; color: var(--head); opacity: 0; animation: textReveal .55s cubic-bezier(.16,1,.3,1) .1s forwards; }

  .promo-offer {
    font-size: 26px; font-weight: 800; line-height: 1.25; margin-bottom: 24px;
    background: linear-gradient(110deg, var(--head) 0%, var(--head) 38%, var(--accent) 50%, var(--head) 62%, var(--head) 100%) 0 0 / 220% 100%;
    color: transparent; -webkit-background-clip: text; background-clip: text;
    opacity: 0; animation: textReveal .55s cubic-bezier(.16,1,.3,1) .22s forwards, offerShimmer 3.2s linear .8s infinite;
  }
  .promo-offer .accent { color: var(--accent); }

  /* ---------- CTA (4 styles) ---------- */
  .cta {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 26px; font-size: 16px; font-weight: 700; font-family: inherit; border-radius: 8px; cursor: pointer;
    opacity: 0; animation: textReveal .55s cubic-bezier(.16,1,.3,1) .34s forwards;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .cta:hover { transform: translateY(-2px); }
  .cta::after {
    content: ""; position: absolute; top: -50%; left: -80%; width: 45%; height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,.7) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(28deg); animation: sweep 2.6s infinite ease-in-out; pointer-events: none;
  }
  .btn-solid    { background: var(--b1); color: var(--bt); border: none; box-shadow: 0 6px 18px -4px rgba(0,0,0,.35); }
  .btn-gradient { background: linear-gradient(90deg, var(--b1), var(--b2)); color: var(--bt); border: none; box-shadow: 0 6px 18px -4px rgba(0,0,0,.35); }
  .btn-outline  { background: transparent; color: var(--b1); border: 2px solid var(--b1); }
  .btn-outline:hover { background: var(--b1); color: var(--bt); }
  .btn-glass    { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.55); backdrop-filter: blur(8px); }

  /* ---------- Person image (bottom-right, bleeds to card edge) ---------- */
  .promo-image-wrapper {
    position: absolute; right: 0; bottom: 0; top: 0; width: 46%;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none; z-index: 1;
  }
  .promo-png {
    height: 88%; width: auto; max-width: 100%; object-fit: contain; object-position: bottom;
    margin-right: 8px; filter: drop-shadow(-6px 6px 14px rgba(0,0,0,.38));
    animation: slideUpPerson .55s ease-out forwards;
  }

  /* ---------- Keyframes ---------- */
  @keyframes textReveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes offerShimmer { 0% { background-position: 200% 0; } 60%, 100% { background-position: -20% 0; } }
  @keyframes sweep { 0% { left: -80%; } 55%, 100% { left: 140%; } }
  @keyframes slideUpPerson { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popUp { from { opacity: 0; transform: scale(.92) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 620px) {
    .promo-card { flex-direction: column; text-align: center; padding: 28px 22px 0; }
    .promo-text { max-width: 100%; margin-bottom: 18px; }
    .promo-image-wrapper { position: relative; width: 100%; height: 200px; }
    .promo-png { height: 100%; margin: 0 auto; }
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">Quick<span>Dial</span></div>
  <div class="nav-right">
    <select id="themeSelect" aria-label="Choose theme"></select>
    <button class="reopen-btn" onclick="openModal()">Show Offer Popup</button>
  </div>
</header>

<main class="page-content">
  <h1>Grow Your Business Online</h1>
  <p>Pick a theme from the menu above to restyle the popup. Click "Show Offer Popup" to replay it.</p>
</main>

<div class="modal-overlay" id="promoModal" onclick="closeOnOutside(event)">
  <div class="promo-card" id="card">
    <button class="close-btn" onclick="closeModal()" aria-label="Close popup">✕</button>

    <div class="promo-text">
      <p class="promo-headline">Get Customers Enquiries &amp; Increase Sale Growth</p>
      <h2 class="promo-offer">Upto <span class="accent">50% Off</span> + Extra Benefits</h2>
      <button class="cta" id="ctaBtn" onclick="handlePlanClick(this)"><span>View All Plans</span><span>&rsaquo;</span></button>
    </div>

    <div class="promo-image-wrapper">
      <img src="person.png" alt="Promotional spokesperson" class="promo-png" onerror="this.style.display='none'">
    </div>
  </div>
</div>

<script>
  // [name, background, headline, accent, button style, button color 1, button color 2, button text]
  const themes = [
    ['Royal Purple', 'linear-gradient(125deg,#2b1280 0%,#4b1bc4 52%,#6828e8 100%)', '#ffffff', '#ffe600', 'solid', '#ffd000', '', '#111827'],
    ['Midnight Blue', 'linear-gradient(125deg,#0f172a 0%,#1e3a8a 55%,#2563eb 100%)', '#ffffff', '#facc15', 'outline', '#facc15', '', '#facc15'],
    ['Ocean Teal', 'linear-gradient(125deg,#064e3b 0%,#0f766e 55%,#14b8a6 100%)', '#ffffff', '#fde047', 'gradient', '#ffffff', '#a7f3d0', '#064e3b'],
    ['Sunset Orange', 'linear-gradient(125deg,#9a3412 0%,#ea580c 55%,#fb923c 100%)', '#ffffff', '#fef08a', 'solid', '#fff7ed', '', '#9a3412'],
    ['Rose Pink', 'linear-gradient(125deg,#881337 0%,#be123c 55%,#f43f5e 100%)', '#ffffff', '#fde68a', 'gradient', '#fff1f2', '#fecdd3', '#881337'],
    ['Emerald Green', 'linear-gradient(125deg,#064e3b 0%,#059669 55%,#34d399 100%)', '#ffffff', '#fef08a', 'solid', '#ffffff', '', '#064e3b'],
    ['Indigo Violet', 'linear-gradient(125deg,#312e81 0%,#4338ca 55%,#818cf8 100%)', '#ffffff', '#c4b5fd', 'outline', '#ffffff', '', '#ffffff'],
    ['Charcoal & Gold', 'linear-gradient(125deg,#111827 0%,#1f2937 55%,#374151 100%)', '#f9fafb', '#fbbf24', 'gradient', '#fde68a', '#f59e0b', '#111827'],
    ['Ruby Crimson', 'linear-gradient(125deg,#450a0a 0%,#991b1b 55%,#dc2626 100%)', '#ffffff', '#fecaca', 'solid', '#ffffff', '', '#450a0a'],
    ['Aurora Glass', 'linear-gradient(125deg,#1e1b4b 0%,#7e22ce 55%,#db2777 100%)', '#ffffff', '#fef08a', 'glass', '', '', '#ffffff'],
    ['Plum Berry', 'linear-gradient(125deg,#4a044e 0%,#86198f 55%,#c026d3 100%)', '#ffffff', '#f5d0fe', 'solid', '#f0abfc', '', '#4a044e'],
    ['Electric Blue', 'linear-gradient(125deg,#1d4ed8 0%,#4f46e5 55%,#7c3aed 100%)', '#ffffff', '#a5f3fc', 'gradient', '#22d3ee', '#a78bfa', '#0f172a'],
    ['Teal Neon', 'linear-gradient(125deg,#042f2e 0%,#0e7490 60%,#06b6d4 100%)', '#ffffff', '#a7f3d0', 'solid', '#22d3ee', '', '#042f2e'],
    ['Forest Night', 'linear-gradient(125deg,#14532d 0%,#166534 55%,#15803d 100%)', '#ffffff', '#bef264', 'outline', '#bef264', '', '#bef264'],
    ['Amber Glow', 'linear-gradient(125deg,#78350f 0%,#b45309 55%,#f59e0b 100%)', '#ffffff', '#fffbeb', 'solid', '#ffffff', '', '#78350f'],
    ['Coral Peach', 'linear-gradient(125deg,#ff9a8b 0%,#ff6a88 100%)', '#ffffff', '#fff7ad', 'solid', '#ffffff', '', '#be123c'],
    ['Slate Minimal', 'linear-gradient(125deg,#334155 0%,#475569 100%)', '#f8fafc', '#7dd3fc', 'solid', '#38bdf8', '', '#0f172a'],
    ['Graphite Red', 'linear-gradient(125deg,#18181b 0%,#27272a 100%)', '#fafafa', '#fca5a5', 'solid', '#ef4444', '', '#ffffff'],
    ['Soft Sky', 'linear-gradient(125deg,#e0f2fe 0%,#bae6fd 100%)', '#0c4a6e', '#0284c7', 'solid', '#0284c7', '', '#ffffff'],
    ['Mint Fresh', 'linear-gradient(125deg,#ecfdf5 0%,#a7f3d0 100%)', '#064e3b', '#059669', 'solid', '#059669', '', '#ffffff'],
    ['Lavender Soft', 'linear-gradient(125deg,#f5f3ff 0%,#ddd6fe 100%)', '#3b0764', '#7c3aed', 'gradient', '#7c3aed', '#a855f7', '#ffffff'],
    ['Warm Cream', 'linear-gradient(125deg,#fef3c7 0%,#fde68a 100%)', '#78350f', '#b45309', 'solid', '#92400e', '', '#ffffff'],
    ['Clean White Blue', 'linear-gradient(125deg,#ffffff 0%,#eff6ff 100%)', '#0f172a', '#2563eb', 'solid', '#2563eb', '', '#ffffff'],
    ['Deep Navy Glass', 'linear-gradient(125deg,#020617 0%,#172554 100%)', '#ffffff', '#93c5fd', 'glass', '', '', '#ffffff'],
    ['Obsidian Gold', 'linear-gradient(125deg,#0a0a0a 0%,#1c1917 55%,#292524 100%)', '#fafaf9', '#d4af37', 'gradient', '#f5d06f', '#c9a227', '#1c1917'],
    ['Pacific Blue', 'linear-gradient(125deg,#0c4a6e 0%,#0369a1 55%,#0ea5e9 100%)', '#ffffff', '#bae6fd', 'solid', '#ffffff', '', '#0369a1'],
    ['Berry Pink', 'linear-gradient(125deg,#831843 0%,#db2777 55%,#f472b6 100%)', '#ffffff', '#fbcfe8', 'gradient', '#ffffff', '#fbcfe8', '#831843'],
    ['Steel Indigo', 'linear-gradient(125deg,#1e1b4b 0%,#312e81 100%)', '#ffffff', '#a5b4fc', 'outline', '#a5b4fc', '', '#a5b4fc'],
    ['Cool Grey Light', 'linear-gradient(125deg,#f8fafc 0%,#e2e8f0 100%)', '#0f172a', '#4f46e5', 'solid', '#4f46e5', '', '#ffffff'],
    ['Peach Light', 'linear-gradient(125deg,#fff7ed 0%,#fed7aa 100%)', '#7c2d12', '#ea580c', 'gradient', '#f97316', '#ea580c', '#ffffff'],
    ['Cyan Sky Glass', 'linear-gradient(125deg,#0e7490 0%,#0891b2 55%,#22d3ee 100%)', '#ffffff', '#ecfeff', 'glass', '', '', '#ffffff'],
    ['Emerald Outline', 'linear-gradient(125deg,#022c22 0%,#064e3b 100%)', '#ffffff', '#6ee7b7', 'outline', '#6ee7b7', '', '#6ee7b7'],
    ['Burgundy Gold', 'linear-gradient(125deg,#4c0519 0%,#881337 100%)', '#ffffff', '#fcd34d', 'solid', '#fde68a', '', '#4c0519'],
    ['Royal Blue Light', 'linear-gradient(125deg,#eff6ff 0%,#dbeafe 100%)', '#1e3a8a', '#1d4ed8', 'solid', '#1e3a8a', '', '#ffffff'],
    ['Violet Glass', 'linear-gradient(125deg,#4c1d95 0%,#6d28d9 55%,#a78bfa 100%)', '#ffffff', '#ddd6fe', 'glass', '', '', '#ffffff']
  ];

  const card = document.getElementById('card');
  const cta = document.getElementById('ctaBtn');
  const select = document.getElementById('themeSelect');
  const modal = document.getElementById('promoModal');

  themes.forEach(([name], i) => select.add(new Option(name, i)));

  function applyTheme(i) {
    const [, bg, head, accent, style, b1, b2, bt] = themes[i];
    card.style.setProperty('--bg', bg);
    card.style.setProperty('--head', head);
    card.style.setProperty('--accent', accent);
    card.style.setProperty('--b1', b1);
    card.style.setProperty('--b2', b2 || b1);
    card.style.setProperty('--bt', bt);
    cta.className = 'cta btn-' + style;
    cta.style.animation = 'none';
    cta.offsetHeight;
    cta.style.animation = '';
  }

  select.addEventListener('change', () => applyTheme(+select.value));

  function closeModal() { modal.classList.add('hidden'); }

  function openModal() {
    modal.classList.remove('hidden');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = '';
  }

  function closeOnOutside(e) { if (e.target === modal) closeModal(); }

  function handlePlanClick(btn) {
    const original = btn.innerHTML;
    btn.innerHTML = '<span>Loading Plans...</span>';
    setTimeout(() => { btn.innerHTML = original; }, 2000);
  }

  applyTheme(0);
</script>
</body>
</html>
